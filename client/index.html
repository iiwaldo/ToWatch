<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/popcorn-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToWatch — Discover Movies & TV</title>
    <!-- Modern Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      const canvas = document.getElementById("particle-canvas");
      const ctx = canvas.getContext("2d");

      let width, height, dpr;
      let particlesArray = [];
      const mouse = { x: null, y: null, radius: 120 };

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener("mouseleave", () => {
        mouse.x = null;
        mouse.y = null;
      });

      function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        init();
      }

      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.4;
          this.speedY = (Math.random() - 0.5) * 0.4;
          this.baseOpacity = Math.random() * 0.4 + 0.2;
          this.hue = Math.random() > 0.5 ? 25 : 280; // Amber to violet tinting
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          // Mouse Interaction
          if (mouse.x !== null && mouse.y !== null) {
            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
              const force = (mouse.radius - distance) / mouse.radius;
              const angle = Math.atan2(dy, dx);
              this.x -= Math.cos(angle) * force * 2;
              this.y -= Math.sin(angle) * force * 2;
            }
          }

          // Screen boundaries
          if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
            this.reset();
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.baseOpacity})`;
          ctx.fill();
        }
      }

      function init() {
        particlesArray = [];
        // Dynamic particle count based on screen size
        const count = Math.floor((width * height) / 10000);
        for (let i = 0; i < Math.min(count, 120); i++) {
          particlesArray.push(new Particle());
        }
      }

      function connect() {
        const maxDistance = 100;
        for (let a = 0; a < particlesArray.length; a++) {
          for (let b = a; b < particlesArray.length; b++) {
            const dx = particlesArray[a].x - particlesArray[b].x;
            const dy = particlesArray[a].y - particlesArray[b].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < maxDistance) {
              const opacity = (1 - dist / maxDistance) * 0.15;
              ctx.strokeStyle = `rgba(255, 150, 90, ${opacity})`;
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
              ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particlesArray.forEach((p) => {
          p.update();
          p.draw();
        });
        connect();
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", resize);
      resize();
      animate();
    </script>
  </body>
</html>
